name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Smoke test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Snapshot from a script
        shell: bash
        run: |
          python examples/create_zip.py
          python -c "import zipfile; names = zipfile.ZipFile('code.zip').namelist(); print(names); assert '__main__.py' in names and 'metadata.json' in names"

      - name: Snapshot without a main script (python -c)
        shell: bash
        run: |
          python -c "from src_snapshot import create_snapshot; create_snapshot('interactive.zip', source_folders='src')"
          python -c "import zipfile; names = zipfile.ZipFile('interactive.zip').namelist(); print(names); assert '__main__.py' not in names"

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/src-snapshot
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
